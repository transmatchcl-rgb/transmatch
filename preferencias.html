<script>
/* Link del pie de los emails: lleva al perfil correcto según el tipo de cuenta. */
(function(){
  var rol=''; try{ if(localStorage.getItem('tm_token')) rol=localStorage.getItem('tm_role')||''; }catch(e){}
  var destino = rol==='cliente' ? '/cliente-perfil.html' : rol==='transportista' ? '/transportista-perfil.html' : rol==='admin' ? '/admin.html' : '/login.html';
  location.replace(destino);
})();
</script>
