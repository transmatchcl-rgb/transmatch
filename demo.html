<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TransMatch · Demo</title>
<link rel="icon" href="/favicon.svg">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1E2D4E;font-family:Barlow,system-ui,sans-serif;color:#fff}
  .box{text-align:center}
  .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#FF8808;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div id="msg" style="font-size:15px;font-weight:600;letter-spacing:.3px">Preparando demo…</div>
  <div class="spin"></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  try{ sessionStorage.removeItem('tm_demo_state_v1'); }catch(e){}
  if(q.get('salir')==='1'){
    try{ localStorage.clear(); }catch(e){}
    location.replace('/index.html');
    return;
  }
  try{
    localStorage.clear();
    localStorage.setItem('tm_demo','1');
    localStorage.setItem('tm_token','demo_token');
    localStorage.setItem('tm_role','cliente');
    localStorage.setItem('tm_email','demo@transmatch.cl');
    localStorage.setItem('tm_nombre','Usuario Demo');
    localStorage.setItem('tm_empresa','Constructora Cordillera (Demo)');
    localStorage.setItem('tm_plan','pro');
  }catch(e){
    document.getElementById('msg').textContent='No se pudo iniciar la demo (almacenamiento bloqueado).';
    return;
  }
  location.replace('/cliente.html');
})();
</script>
</body>
</html>
