<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>TransMatch — Limpieza de datos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:#f5f7fb;color:#111827}
header{background:#1e2d4e;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;font-size:13px;opacity:.85}
main{max-width:760px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;border:0.5px solid #e8eaf0;box-shadow:0 1px 4px rgba(30,45,78,.06);padding:18px 20px;margin-bottom:14px}
h1{font-size:20px;color:#1e2d4e;margin-bottom:4px}
.sub{font-size:13px;color:#6B7280;margin-bottom:14px;line-height:1.45}
textarea,input{width:100%;border:1px solid #D1D5DB;border-radius:8px;padding:9px 11px;font:inherit;font-size:14px}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.btn-nav{background:#1e2d4e;color:#fff}.btn-red{background:#DC2626;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
h3{font-size:12px;font-weight:700;color:#9CA3AF;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #EEF1F6;font-size:13px}
.row small{color:#6B7280}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#F3F4F6;color:#374151;white-space:nowrap;align-self:center}
.warn{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45;margin-top:12px}
.okbox{background:#F0FDF4;border:1px solid #BBF7D0;color:#166534;border-radius:8px;padding:10px 12px;font-size:13px}
</style>
</head>
<body>
<header><b>TransMatch · Limpieza de datos de prueba</b><a href="/admin-licitaciones.html">← Volver al admin</a></header>
<main>
  <div class="card">
    <h1>Borrar datos de prueba</h1>
    <div class="sub">Pega los códigos de las licitaciones de prueba. Se borran <b>definitivamente</b> junto con sus cotizaciones, preguntas, transportes, órdenes de venta, archivos y notificaciones. No se puede deshacer.</div>
    <textarea id="codigos" rows="3" placeholder="LIC-0001, LIC-0002, LIC-0003"></textarea>
    <div style="margin-top:10px"><button class="btn btn-nav" id="btn-prev" onclick="revisar()">Revisar qué se borrará</button></div>
  </div>
  <div id="res"></div>
</main>
<script>
const API=(localStorage.getItem('tm_api')||'https://transmatch.transmatchcl.workers.dev');
(function(){ if(!localStorage.getItem('tm_token')||localStorage.getItem('tm_role')!=='admin') location.replace('/admin-login.html'); })();
function e(x){ return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function clp(n){ return n==null?'':'$'+Math.round(n).toLocaleString('es-CL'); }
async function api(body){
  const r=await fetch(API+'/api/admin/limpieza',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+localStorage.getItem('tm_token')},body:JSON.stringify(body)});
  if(r.status===401){ location.replace('/admin-login.html'); return null; }
  return { ok:r.ok, data:await r.json().catch(()=>({})) };
}
function codigos(){ return (document.getElementById('codigos').value.match(/LIC-?\d+/gi)||[]).map(c=>c.toUpperCase().replace(/^LIC-?/,'LIC-')); }
function lista(t, arr, fn){ return arr.length?'<h3>'+t+' ('+arr.length+')</h3>'+arr.map(fn).join(''):''; }
let _ultimos=[];
async function revisar(){
  const cs=codigos(); const res=document.getElementById('res');
  if(!cs.length){ res.innerHTML='<div class="card warn">Escribe al menos un código LIC-XXXX.</div>'; return; }
  res.innerHTML='<div class="card">Revisando…</div>';
  const r=await api({codigos:cs}); if(!r) return;
  if(!r.ok){ res.innerHTML='<div class="card warn">'+e(r.data.error||'Error')+'</div>'; return; }
  const d=r.data; _ultimos=d.licitaciones.map(l=>l.codigo);
  let h='<div class="card"><div style="font-size:15px;font-weight:600;color:#1e2d4e">Se borrará esto:</div>'
    +lista('Licitaciones', d.licitaciones, l=>'<div class="row"><span><b>'+e(l.codigo)+'</b> · '+e(l.cliente)+'<br><small>'+e(l.ruta)+' · '+l.cotizaciones+' cotización(es)</small></span><span class="tag">'+e(l.estado)+'</span></div>')
    +lista('Transportes', d.transportes, t=>'<div class="row"><span><b>'+e(t.codigo)+'</b> · '+e(t.transportista)+'</span><span class="tag">'+e(t.estado)+'</span></div>')
    +lista('Órdenes de venta', d.ordenes, o=>'<div class="row"><span>'+e(o.id.slice(0,8))+'… <small>'+clp(o.comision)+'</small></span><span class="tag">'+e(o.estado)+'</span></div>')
    +lista('Facturas consolidadas', d.facturas, f=>'<div class="row"><span>'+e(f.periodo||f.id)+'</span><span class="tag">'+e(f.estado)+'</span></div>')
    +(d.archivos?'<h3>Archivos</h3><div class="row"><span>'+d.archivos+' archivo(s) adjunto(s)</span></div>':'')
    +(d.noEncontradas.length?'<div class="warn">No encontré: '+e(d.noEncontradas.join(', '))+'</div>':'')
    +(d.facturasMixtas.length?'<div class="warn">Hay '+d.facturasMixtas.length+' factura(s) consolidada(s) que mezclan estas OV con OV reales. No se puede borrar hasta revisarlas.</div>':'');
  if(d.licitaciones.length && !d.facturasMixtas.length){
    h+='<div class="warn"><b>Esto no se puede deshacer.</b> Para confirmar, escribe <b>BORRAR</b>:<input id="conf" style="margin-top:8px" oninput="document.getElementById(\'btn-del\').disabled=this.value!==\'BORRAR\'" autocomplete="off"></div>'
      +'<div style="margin-top:12px"><button class="btn btn-red" id="btn-del" disabled onclick="borrar()">Borrar definitivamente</button></div>';
  }
  res.innerHTML=h+'</div>';
}
async function borrar(){
  const b=document.getElementById('btn-del'); b.disabled=true; b.textContent='Borrando…';
  const r=await api({codigos:_ultimos, ejecutar:true, confirmacion:document.getElementById('conf').value}); if(!r) return;
  const res=document.getElementById('res');
  if(!r.ok){ res.innerHTML='<div class="card warn">'+e(r.data.error||'Error')+'</div>'; return; }
  const d=r.data;
  const f=d.fallos||[];
  res.innerHTML='<div class="card">'+(f.length
    ? '<div class="warn" style="margin-top:0"><b>No se pudo borrar todo.</b> Copia este detalle y envíalo:<br><br>'+f.map(e).join('<br>')+'</div>'
    : '<div class="okbox">Listo y verificado en la base de datos: se borraron '+d.licitaciones.length+' licitación(es), '+d.transportes.length+' transporte(s), '+d.ordenes.length+' OV y '+d.archivos+' archivo(s).</div>')+'</div>';
  document.getElementById('codigos').value='';
}
</script>
</body>
</html>
